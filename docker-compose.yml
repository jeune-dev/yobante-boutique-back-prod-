# ============================================================
#  Yobante Boutique — Docker Compose DÉVELOPPEMENT
#  Usage : docker compose up --build
#  Pour la production : docker compose -f docker-compose.prod.yml up -d
# ============================================================

services:

  # ── PostgreSQL ─────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: yobante_postgres_dev
    restart: unless-stopped
    environment:
      POSTGRES_DB:       ${DB_NAME:-yobante}
      POSTGRES_USER:     ${DB_USER:-yobante}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-yobantepassword}
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
    # En dev uniquement : exposer le port pour se connecter via pgAdmin / DBeaver
    ports:
      - "5432:5432"
    networks:
      - yobante_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-yobante} -d ${DB_NAME:-yobante}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ── Backend Node.js ────────────────────────────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: yobante_backend_dev
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "5000:5000"
    env_file:
      - .env
    environment:
      NODE_ENV:  development
      PORT:      5000
      DB_HOST:   postgres
      DB_PORT:   5432
      DB_NAME:   ${DB_NAME:-yobante}
      DB_USER:   ${DB_USER:-yobante}
      DB_PASSWORD: ${DB_PASSWORD:-yobantepassword}
      DB_SSL_CA: ""
      LOG_DIR:   /app/logs
    volumes:
      - ./uploads:/app/uploads
      - ./logs:/app/logs
    networks:
      - yobante_network

networks:
  yobante_network:
    driver: bridge

volumes:
  postgres_data_dev:
