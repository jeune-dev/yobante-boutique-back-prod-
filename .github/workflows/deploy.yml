name: Deploy to VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # Le déploiement VPS n'est pas toujours celui qui est utilisé : quand
      # l'hébergement se fait ailleurs (Render, qui redéploie de lui-même au
      # push), les secrets VPS_* ne sont pas renseignés et l'action échouait
      # sur « missing server host » à chaque push. On saute proprement.
      - name: Vérifier la configuration du VPS
        id: config
        run: |
          if [ -z "${{ secrets.VPS_HOST }}" ]; then
            echo "configure=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Aucun VPS configuré (secret VPS_HOST absent) — déploiement SSH ignoré."
          else
            echo "configure=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy via SSH
        if: steps.config.outputs.configure == 'true'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          # Le build Docker (apt + npm ci pour Sharp/canvas) dépasse
          # à lui seul les 10 minutes par défaut d'appleboy/ssh-action, ce qui
          # coupe la connexion SSH avant même `docker compose up -d` — d'où le
          # "Run Command Timeout" alors que l'image finit de se construire.
          command_timeout: "30m"
          script: |
            set -e
            cd /var/www/yobante-boutique-api

            # Récupérer le nouveau code — `set -e` fait échouer tout le
            # déploiement si le pull échoue (ex: problème d'authentification),
            # au lieu de continuer silencieusement avec l'ancien code.
            # --rebase : le VPS peut avoir des commits locaux (ex: config
            # docker-compose spécifique à cette machine, jamais poussés) —
            # un pull classique diverge dès que GitHub avance, --rebase les
            # rejoue proprement par-dessus à chaque déploiement.
            git pull --rebase origin main

            # Rebuilder et relancer les services
            docker compose -f docker-compose.prod.yml up -d --build

            # Les migrations s'exécutent automatiquement au démarrage du backend
            # (voir server.js pour le flux complet: migrations → sync → runtime)

            # Attendre que les migrations et le démarrage se terminent
            sleep 15

            # Vérifier que le backend est healthy
            curl -f http://localhost:5000/health || exit 1
